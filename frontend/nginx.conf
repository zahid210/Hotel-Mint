# ════════════════════════════════════════════════════════════════
# Nginx — Hotel Bahía (HTTPS / TLS + Seguridad reforzada)
# ════════════════════════════════════════════════════════════════

# 1. Servidor HTTP (Puerto 80): Redirección obligatoria a HTTPS
server {
    listen 80;
    server_name _;

    # Endpoint de verificación de salud para Docker / Load Balancers
    location = /healthz {
        access_log off;
        return 200 "OK\n";
    }

    # Redirección 301 permanente a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Servidor HTTPS (Puerto 443): Aplicación SPA + Proxy API
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Certificados SSL / TLS
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # ── Cabeceras de seguridad estrictas (P1-02) ──────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Compresión gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Endpoint de verificación de salud en HTTPS
    location = /healthz {
        access_log off;
        return 200 "OK\n";
    }

    # Archivos estáticos de la SPA React
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso a la API REST de Spring Boot
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
