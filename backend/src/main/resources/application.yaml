spring:
  datasource:
    url:      ${DATABASE_URL:jdbc:mariadb://localhost:3306/hotel_bahia}
    username: ${DATABASE_USERNAME:hotel}
    password: ${DATABASE_PASSWORD:hotel_bahia}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

  jackson:
    time-zone: ${APP_TIMEZONE:America/Lima}

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  timezone: ${APP_TIMEZONE:America/Lima}
  admin:
    email:    ${APP_ADMIN_EMAIL:zahidmatos@hotel.com}
    nombre:   ${APP_ADMIN_NOMBRE:Zahid Matos}
    password: ${APP_ADMIN_PASSWORD:}
  seed-demo: ${APP_SEED_DEMO:false}