# ════════════════════════════════════════════════════════════════
# Hotel Bahía — Arquitectura desacoplada en 3 contenedores (3 Capas)
#
#   docker compose up -d --build
#
# Servicios:
#   db       → MariaDB 11 (puerto interno 3306, no publicado al host)
#   backend  → Spring Boot API pura (puerto interno 8080, no publicado al host)
#   frontend → Nginx sirviendo SPA React (puertos 80/443) + proxy a /api
# ════════════════════════════════════════════════════════════════

services:
  db:
    image: mariadb:11.4.5
    container_name: hotel-bahia-db
    restart: unless-stopped
    expose:
      - "3306"
    environment:
      MYSQL_DATABASE:      ${DB_NAME:-hotel_bahia}
      MYSQL_USER:          ${DB_USER:-hotel}
      MYSQL_PASSWORD:      "${DB_PASSWORD:?DB_PASSWORD es obligatorio}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD es obligatorio}"
    volumes:
      - dbdata:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hotel-bahia-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DATABASE_URL:           jdbc:mariadb://db:3306/${DB_NAME:-hotel_bahia}
      DATABASE_USERNAME:      ${DB_USER:-hotel}
      DATABASE_PASSWORD:      "${DB_PASSWORD:?DB_PASSWORD es obligatorio}"
      JWT_SECRET:             "${JWT_SECRET:?JWT_SECRET es obligatorio}"
      JWT_EXPIRATION_MS:      ${JWT_EXPIRATION_MS:-86400000}
      APP_TIMEZONE:           ${APP_TIMEZONE:-America/Lima}
      APP_ADMIN_EMAIL:        ${APP_ADMIN_EMAIL:-zahidmatos@hotel.com}
      APP_ADMIN_NOMBRE:       ${APP_ADMIN_NOMBRE:-Zahid Matos}
      APP_ADMIN_PASSWORD:     "${APP_ADMIN_PASSWORD:?APP_ADMIN_PASSWORD es obligatorio}"
      APP_SEED_DEMO:          ${APP_SEED_DEMO:-false}
      FRONTEND_URL:           ${FRONTEND_URL:-http://localhost,https://localhost,http://localhost:80,https://localhost:443}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/v1/server/time"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: hotel-bahia-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_SSL_PORT:-443}:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  dbdata:
