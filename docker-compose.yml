# ════════════════════════════════════════════════════════════════
# Hotel Bahía — Arquitectura desacoplada en 3 contenedores (3 Capas)
#
#   docker compose up -d --build
#
# Servicios:
#   db       → MariaDB 11 (puerto 3307 en el host)
#   backend  → Spring Boot API pura (puerto 8080)
#   frontend → Nginx sirviendo la SPA React (puerto 80) + proxy a /api
# ════════════════════════════════════════════════════════════════

services:
  db:
    image: mariadb:11
    container_name: hotel-bahia-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE:      ${DB_NAME:-hotel_bahia}
      MYSQL_USER:          ${DB_USER:-hotel}
      MYSQL_PASSWORD:      ${DB_PASSWORD:-hotel_bahia}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_local}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hotel-bahia-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DATABASE_URL:           jdbc:mariadb://db:3306/${DB_NAME:-hotel_bahia}
      DATABASE_USERNAME:      ${DB_USER:-hotel}
      DATABASE_PASSWORD:      ${DB_PASSWORD:-hotel_bahia}
      JWT_SECRET:             ${JWT_SECRET:?Define JWT_SECRET en tu .env (ver .env.example)}
      JWT_EXPIRATION_MS:      ${JWT_EXPIRATION_MS:-86400000}
      APP_TIMEZONE:           ${APP_TIMEZONE:-America/Lima}
      APP_ADMIN_EMAIL:        ${APP_ADMIN_EMAIL:-zahidmatos@hotel.com}
      APP_ADMIN_NOMBRE:       ${APP_ADMIN_NOMBRE:-Zahid Matos}
      APP_ADMIN_PASSWORD:     ${APP_ADMIN_PASSWORD:-hotel_bahia}
      FRONTEND_URL:           ${FRONTEND_URL:-http://localhost,http://localhost:80}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/v1/server/time"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: hotel-bahia-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  dbdata:
